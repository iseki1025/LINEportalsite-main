<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初期セットアップ - 梶本クリニック 統合管理システム</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components.css">
    <script>
        // file:// プロトコルでの実行をチェック
        if (window.location.protocol === 'file:') {
            window.addEventListener('DOMContentLoaded', () => {
                const msg = document.getElementById('msg');
                msg.style.color = '#e53e3e';
                msg.style.background = '#fff5f5';
                msg.style.padding = '1rem';
                msg.style.borderRadius = '8px';
                msg.style.border = '1px solid #feb2b2';
                msg.innerHTML = '<strong>⚠️ セキュリティエラー</strong><br>' +
                    'ブラウザの仕様により、ファイルを直接開くとプログラムが動作しません。<br>' +
                    '付属の <code>start_server.bat</code> を実行してから<br>' +
                    '<a href="http://localhost:8000/admin-setup.html">http://localhost:8000/admin-setup.html</a><br>' +
                    'を開いてください。';
            });
        }
    </script>
</head>

<body class="auth-page-body">
    <div class="auth-container">
        <div class="auth-header">
            <h1>🔧 初回セットアップ</h1>
            <p>最初のシステム管理者アカウントを作成します。</p>
        </div>
        <div id="setupForm" class="form-section">
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" required placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label for="password">パスワード（8文字以上）</label>
                <input type="password" id="password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirmPassword">パスワード（確認）</label>
                <input type="password" id="confirmPassword" required minlength="8">
            </div>
            <div class="form-group">
                <label for="displayName">表示名（例：山田 太郎）</label>
                <input type="text" id="displayName" required>
            </div>
            <div class="form-group">
                <label for="facility">所属施設</label>
                <select id="facility" required>
                    <option value="本院">本院</option>
                    <option value="なかもず分院">なかもず分院</option>
                    <option value="三国ヶ丘分院">三国ヶ丘分院</option>
                </select>
            </div>
            <div class="btn-container">
                <button type="button" id="submitBtn" class="btn-auth">管理者を作成する</button>
            </div>
            <div id="msg" style="margin-top:1rem; text-align:center;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { firebaseConfig } from './js/firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const submitBtn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');

        // 初期化チェック
        async function checkInitialized() {
            try {
                const setupDoc = await getDoc(doc(db, 'system', 'setup'));
                if (setupDoc.exists() && setupDoc.data().initialized) {
                    alert('セットアップは既に完了しています。ログイン画面へ移動します。');
                    transitionNavigate('admin-login.html', { replace: true });
                }
            } catch (err) {
                console.warn('Initial check failed (normal if rules block read for unauth):', err);
            }
        }
        checkInitialized();

        submitBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const displayName = document.getElementById('displayName').value;
            const facility = document.getElementById('facility').value;

            if (!email || !password || !displayName) {
                alert('必要事項を入力してください。');
                return;
            }
            if (password !== confirmPassword) {
                alert('パスワードが一致しません。');
                return;
            }

            submitBtn.disabled = true;
            msg.textContent = '作成中...';

            try {
                // 1. アカウント作成
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                // 2. Firestoreにユーザー情報を保存
                await setDoc(doc(db, 'users', uid), {
                    uid: uid,
                    email: email,
                    displayName: displayName,
                    facility: facility,
                    role: 'admin',
                    permissions: { qa: true, dialysisStatus: true, recipes: true },
                    createdAt: new Date(),
                    updatedAt: new Date()
                });

                // 3. セットアップ完了フラグを立てる
                await setDoc(doc(db, 'system', 'setup'), {
                    initialized: true,
                    initializedAt: new Date(),
                    initializedBy: uid
                });

                msg.style.color = 'green';
                msg.textContent = '管理者アカウントの作成に成功しました。ダッシュボードへ移動します。';
                setTimeout(() => transitionNavigate('admin-dashboard.html', { replace: true }), 2000);
            } catch (error) {
                console.error('Setup error:', error);
                msg.style.color = 'red';

                if (error.code === 'auth/operation-not-allowed') {
                    msg.innerHTML = '<strong>❌ Firebase設定エラー</strong><br>' +
                        'Firebaseコンソールで「Email/Password」認証が有効になっていません。<br>' +
                        '1. Firebase Consoleを開く<br>' +
                        '2. Build > Authentication > Sign-in method を開く<br>' +
                        '3. 「Email/Password」を有効（Enable）にしてください。';
                } else {
                    msg.textContent = 'エラーが発生しました：' + error.message;
                }
                submitBtn.disabled = false;
            }
        });
    </script>
    <script src="js/page-transition.js"></script>

</body>

</html>
