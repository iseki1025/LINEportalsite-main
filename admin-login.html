<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 梶本クリニック 統合管理システム</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components.css">
</head>

<body class="auth-page-body">
    <div class="auth-container">
        <div class="auth-header">
            <h1>🏥 梶本クリニック</h1>
            <p>管理システム ログイン</p>
        </div>
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" required placeholder="example@kajimoto-clinic.jp">
            </div>
            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" id="loginBtn" class="btn-auth">ログイン</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
        <div class="setup-link">
            ※初回利用時は <a href="admin-setup.html">こちらからセットアップ</a> してください。
        </div>

        <!-- Visible Back Button -->
        <div class="nav-back-container" style="margin-top: 2rem;">
            <a href="index.html" class="back-to-portal-button"
                style="font-size: 0.9rem; padding: 0.5rem 1rem;">総合情報ポータルへ戻る</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { firebaseConfig } from './js/firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.disabled = true;
            loginBtn.textContent = 'ログイン中...';
            errorMsg.style.display = 'none';

            try {
                await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
                transitionNavigate('admin-dashboard.html', { replace: true });
            } catch (error) {
                console.error('Login error:', error);
                errorMsg.textContent = 'メールアドレスまたはパスワードが正しくありません';
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'ログイン';
            }
        });
    </script>
    <script src="js/page-transition.js"></script>

</body>

</html>
