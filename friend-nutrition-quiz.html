<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>栄養クイズ | 梶本クリニック</title>
    <link rel="stylesheet" href="portal-design.css">
    <style>
        /* Quiz Styles - Orange theme */
        .quiz-info {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: var(--spacing-lg);
        }

        .quiz-progress {
            height: 8px;
            background: var(--border-light);
            border-radius: var(--radius-full);
            margin-bottom: var(--spacing-xl);
            overflow: hidden;
        }

        .quiz-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #34a853, #fbbc04);
            border-radius: var(--radius-full);
            transition: width 0.3s ease;
        }

        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
        }

        .quiz-number {
            font-size: 0.85rem;
            color: #f59e0b;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
        }

        .quiz-question {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: var(--spacing-xl);
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .quiz-option {
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--bg-main);
            border: 2px solid var(--border-light);
            border-radius: var(--radius-md);
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .quiz-option:hover:not(.disabled) {
            border-color: #fcd34d;
            background: rgba(245, 158, 11, 0.05);
        }

        .quiz-option.correct {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            color: #047857;
        }

        .quiz-option.incorrect {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            color: #b91c1c;
        }

        .quiz-option.disabled {
            cursor: default;
            opacity: 0.7;
        }

        .quiz-explanation {
            display: none;
            margin-top: var(--spacing-lg);
            padding: var(--spacing-md);
            background: rgba(245, 158, 11, 0.08);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .quiz-explanation.show {
            display: block;
        }

        .quiz-explanation-title {
            font-weight: 600;
            color: #b45309;
            margin-bottom: var(--spacing-xs);
        }

        .quiz-next-btn {
            display: none;
            width: 100%;
            padding: var(--spacing-md);
            background: linear-gradient(135deg, #34a853 0%, #1e8e3e 100%);
            color: white;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
        }

        .quiz-next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(52, 168, 83, 0.4);
        }

        /* Result */
        .quiz-result {
            display: none;
            text-align: center;
            padding: var(--spacing-2xl);
        }

        .quiz-result.show {
            display: block;
        }

        .result-emoji {
            font-size: 4rem;
            margin-bottom: var(--spacing-md);
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
        }

        .result-score {
            font-size: 2rem;
            font-weight: 700;
            color: #34a853;
            margin-bottom: var(--spacing-sm);
        }

        .result-percent {
            color: var(--text-muted);
            margin-bottom: var(--spacing-xl);
        }

        .restart-btn {
            display: inline-block;
            padding: var(--spacing-md) var(--spacing-2xl);
            background: linear-gradient(135deg, #34a853 0%, #1e8e3e 100%);
            color: white;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="app-header">
        <a href="friend-main.html" class="header-logo">
            <img src="files/common/kajimoto_rogo2.svg" alt="梶本クリニック">
        </a>
        <div class="header-center">
            <div class="header-title">栄養クイズ</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">

        <p class="quiz-info">10問からランダムに5問出題されます</p>

        <div class="quiz-progress">
            <div class="quiz-progress-fill" id="progressFill" style="width: 20%;"></div>
        </div>

        <div class="quiz-card" id="quizContainer">
            <!-- Questions inserted here -->
        </div>

        <button class="quiz-next-btn" id="nextButton">次の問題へ</button>

        <div class="quiz-card quiz-result" id="resultContainer">
            <!-- Results shown here -->
        </div>

        <!-- Back Button -->
        <div class="back-btn-container">
            <a href="friend-main.html" class="btn btn-secondary">
                お友達特典ポータルへ戻る
            </a>
        </div>

        <!-- Copyright -->
        <footer class="copyright mt-xl">
            <a href="index.html" class="stealth-link">© 2025 Kajimoto Clinic</a>
        </footer>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="friend-main.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 12 20 22 4 22 4 12"></polyline>
                <rect x="2" y="7" width="20" height="5"></rect>
            </svg>
            <span>特典トップ</span>
        </a>
        <a href="qa-main.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Q&A</span>
        </a>
    </nav>

    <script>
        const quizData = [
            { question: "透析患者さんが特に注意すべき栄養素はどれですか?", options: ["ビタミンC", "カリウム", "食物繊維"], correct: 1, explanation: "透析患者さんはカリウムの排泄が困難なため、摂取制限が必要です。バナナやイモ類などは控えめにしましょう。" },
            { question: "透析患者さんの1日の塩分摂取目安はどのくらいですか?", options: ["10g以下", "6g以下", "制限なし"], correct: 1, explanation: "1日6g以下の塩分摂取が推奨されています。塩分過多は水分貯留や高血圧の原因になります。" },
            { question: "透析患者さんが避けるべき果物はどれですか?", options: ["りんご", "バナナ", "いちご"], correct: 1, explanation: "バナナは非常にカリウムが多いため避けた方が良いです。りんごやいちごは比較的少なめです。" },
            { question: "カリウムを減らす調理方法として正しいのは?", options: ["電子レンジ", "茹でこぼし", "蒸し調理"], correct: 1, explanation: "野菜を小さく切って「茹でこぼす」ことで、カリウムを約30〜40%減らすことができます。" },
            { question: "リンが多く含まれる食品はどれですか?", options: ["こんにゃく", "乳製品", "きゅうり"], correct: 1, explanation: "牛乳やチーズなどの乳製品はリンを多く含みます。摂りすぎは骨や血管に悪影響を与えます。" },
            { question: "外食時に選ぶべきメニューはどれですか?", options: ["ラーメン", "握り寿司", "焼肉定食"], correct: 1, explanation: "寿司はネタや醤油の量を調整しやすいため比較的良い選択肢です。ラーメンは汁の塩分が非常に高いので避けましょう。" },
            { question: "透析患者さんの水分摂取目安は？", options: ["尿量+500ml", "2リットル", "制限なし"], correct: 0, explanation: "尿量＋500ml程度が基本です。水分過多は心不全の原因になります。" },
            { question: "タンパク質を適切に摂る理由は？", options: ["筋肉量を維持するため", "カリウムを増やすため", "水分を増やすため"], correct: 0, explanation: "透析患者さんは筋肉量の維持が重要です。良質なタンパク質を適量摂りましょう。" },
            { question: "リン吸着剤を飲むタイミングは？", options: ["食直前〜食中", "寝る前", "朝一番"], correct: 0, explanation: "リン吸着剤は食事中のリンと結合するため、食直前〜食中に服用するのが効果的です。" },
            { question: "乾麺と生麺、塩分が少ないのは？", options: ["生麺", "乾麺", "同じ"], correct: 0, explanation: "乾麺は製造過程で塩が多く使われます。生麺の方が塩分が少ない傾向があります。" }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let selectedQuestions = [];

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function selectRandomQuestions() {
            selectedQuestions = shuffleArray(quizData).slice(0, 5);
        }

        function loadQuestion() {
            answered = false;
            const quizContainer = document.getElementById('quizContainer');
            const data = selectedQuestions[currentQuestion];
            const progress = ((currentQuestion + 1) / selectedQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            const shuffledOptions = shuffleArray(data.options.map((option, index) => ({
                text: option, isCorrect: index === data.correct
            })));

            quizContainer.innerHTML = `
                <div class="quiz-number">問題 ${currentQuestion + 1} / ${selectedQuestions.length}</div>
                <div class="quiz-question">${data.question}</div>
                <div class="quiz-options">
                    ${shuffledOptions.map((option, index) => `
                        <div class="quiz-option" onclick="selectOption(${index}, ${option.isCorrect}, this)">${option.text}</div>
                    `).join('')}
                </div>
                <div class="quiz-explanation" id="explanation">
                    <div class="quiz-explanation-title">📝 解説</div>
                    <div>${data.explanation}</div>
                </div>
            `;
            document.getElementById('nextButton').style.display = 'none';
        }

        function selectOption(selectedIndex, isCorrect, element) {
            if (answered) return;
            answered = true;
            document.querySelectorAll('.quiz-option').forEach(opt => opt.classList.add('disabled'));

            if (isCorrect) {
                element.classList.add('correct');
                score++;
            } else {
                element.classList.add('incorrect');
                document.querySelectorAll('.quiz-option').forEach(opt => {
                    if (opt.getAttribute('onclick').includes('true')) opt.classList.add('correct');
                });
            }

            document.getElementById('explanation').classList.add('show');
            const nextButton = document.getElementById('nextButton');
            nextButton.style.display = 'block';
            nextButton.textContent = currentQuestion < selectedQuestions.length - 1 ? '次の問題へ' : '結果を見る';
            nextButton.onclick = nextQuestion;
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < selectedQuestions.length) loadQuestion();
            else showResults();
        }

        function showResults() {
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('nextButton').style.display = 'none';
            const resultContainer = document.getElementById('resultContainer');
            const percentage = (score / selectedQuestions.length) * 100;
            let emoji = percentage === 100 ? '🏆' : (percentage < 60 ? '📚' : '🎉');
            let message = percentage === 100 ? 'パーフェクト!' : 'お疲れ様でした!';

            resultContainer.innerHTML = `
                <div class="result-emoji">${emoji}</div>
                <div class="result-title">${message}</div>
                <div class="result-score">${score} / ${selectedQuestions.length}</div>
                <div class="result-percent">正答率: ${percentage.toFixed(0)}%</div>
                <button class="restart-btn" onclick="restartQuiz()">もう一度挑戦する</button>
            `;
            resultContainer.classList.add('show');
        }

        function restartQuiz() {
            currentQuestion = 0; score = 0; answered = false;
            selectRandomQuestions();
            document.getElementById('quizContainer').style.display = 'block';
            document.getElementById('resultContainer').classList.remove('show');
            loadQuestion();
        }

        selectRandomQuestions();
        loadQuestion();
    </script>

    <script src="js/page-transition.js"></script>

</body>

</html>
