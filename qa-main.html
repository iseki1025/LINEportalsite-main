<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Q&amp;A &#26908;&#32034; | Kajimoto Clinic</title>
    <link rel="stylesheet" href="portal-design.css">
    <style>
        .qa-category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            overflow: visible;
            padding-bottom: 0;
        }
        .qa-tab {
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: normal;
            transition: all var(--transition-fast);
            cursor: pointer;
        }
        .qa-tab:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
        .qa-tab.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: var(--text-inverse);
        }
        .qa-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }
        .qa-item {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .qa-question {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-lg);
            cursor: pointer;
            transition: background var(--transition-fast);
        }
        .qa-question:hover {
            background: var(--bg-glass-dark);
        }
        .qa-question-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: var(--accent-qa);
            color: #fff;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.85rem;
        }
        .qa-question-text {
            flex: 1;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.5;
        }
        .qa-toggle-icon {
            color: var(--text-muted);
            transition: transform var(--transition-normal);
        }
        .qa-item.open .qa-toggle-icon {
            transform: rotate(180deg);
        }
        .qa-answer {
            display: none;
            padding: var(--spacing-md) var(--spacing-lg);
            padding-left: calc(var(--spacing-lg) + 28px + var(--spacing-md));
            background: var(--bg-main);
            border-top: 1px solid var(--border-light);
        }
        .qa-item.open .qa-answer {
            display: block;
        }
        .qa-answer-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: var(--color-primary);
            color: #fff;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.85rem;
            margin-right: var(--spacing-sm);
            vertical-align: top;
        }
        .qa-answer-text {
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .no-results {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header class="app-header">
        <a href="index.html" class="header-logo">
            <img src="files/common/kajimoto_rogo2.svg" alt="Kajimoto Clinic">
        </a>
        <div class="header-center">
            <div class="header-title">Q&amp;A &#26908;&#32034;</div>
        </div>
    </header>

    <main class="main-content">
        <div class="search-container">
            <input type="text" class="search-input" id="qaSearchInput" placeholder="キーワードで検索...">

            <div style="font-size:0.8rem; color:var(--text-muted); margin-top:1rem; margin-bottom:0.5rem;">
                よく検索されるキーワード
            </div>
            <div class="keyword-buttons" id="keywordButtons">
                <button class="keyword-btn" onclick="setKeyword('食事')">食事</button>
                <button class="keyword-btn" onclick="setKeyword('診療時間')">診療時間</button>
                <button class="keyword-btn" onclick="setKeyword('生活習慣')">生活習慣</button>
                <button class="keyword-btn" onclick="setKeyword('シャント')">シャント</button>
                <button class="keyword-btn" onclick="setKeyword('送迎')">送迎</button>
                <button class="keyword-btn" onclick="setKeyword('検査')">検査</button>
            </div>
        </div>

        <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.5rem; padding-left:0.25rem;">
            カテゴリで絞り込み:
        </div>
        <div class="qa-category-tabs" id="categoryTabs">
            <button class="qa-tab active" data-category="all">すべて</button>
            <button class="qa-tab" data-category="insurance">保険・費用</button>
            <button class="qa-tab" data-category="treatment">治療</button>
            <button class="qa-tab" data-category="transport">送迎</button>
            <button class="qa-tab" data-category="test">検査</button>
            <button class="qa-tab" data-category="nutrition">食事</button>
            <button class="qa-tab" data-category="shunt">シャント</button>
            <button class="qa-tab" data-category="schedule">診療時間</button>
            <button class="qa-tab" data-category="lifestyle">生活習慣</button>
            <button class="qa-tab" data-category="disaster">災害</button>
        </div>

        <div class="qa-list" id="qaList">
            <p class="no-results">Q&amp;A loading...</p>
        </div>

        <div class="back-btn-container">
            <a href="index.html" class="btn btn-secondary">
                &#12488;&#12483;&#12503;&#12506;&#12540;&#12472;&#12408;&#25147;&#12427;
            </a>
        </div>

        <footer class="copyright">
            <a href="index.html" class="stealth-link">© 2025 Kajimoto Clinic</a>
        </footer>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="js/qa/qa-source.js"></script>
    <script src="js/qa/qa-data-embedded.js"></script>
    <script>
        let qaMasterData = [];

        function appendCacheBuster(url) {
            const separator = url.includes('?') ? '&' : '?';
            return `${url}${separator}t=${Date.now()}`;
        }

        function setKeyword(word) {
            const input = document.getElementById('qaSearchInput');
            if (!input) return;
            input.value = word;
            filterQA();
        }

        function toggleQA(element) {
            const item = element.closest('.qa-item');
            if (!item) return;
            item.classList.toggle('open');
        }

        function normalizeCategoryText(text) {
            return String(text || '').toLowerCase().replace(/\s+/g, '');
        }

        function categoryTokenToKeys(token) {
            const cat = normalizeCategoryText(token);
            if (!cat) return [];

            const keys = [];
            if (cat.includes('保険') || cat.includes('費用')) keys.push('insurance');
            if (cat.includes('治療')) keys.push('treatment');
            if (cat.includes('送迎')) keys.push('transport');
            if (cat.includes('検査')) keys.push('test');
            if (cat.includes('食事') || cat.includes('栄養')) keys.push('nutrition');
            if (cat.includes('シャント')) keys.push('shunt');
            if (cat.includes('診療時間') || cat.includes('スケジュール')) keys.push('schedule');
            if (cat.includes('生活習慣') || cat.includes('ライフスタイル')) keys.push('lifestyle');
            if (cat.includes('災害')) keys.push('disaster');
            return keys;
        }

        function getCategoriesFromData(categoryField) {
            const raw = String(categoryField || '');
            const splitTokens = raw
                .split(/[,\u3001\uFF0C\/\uFF0F|\n\r;\uFF1B\u30FB]+/)
                .map((s) => s.trim())
                .filter(Boolean);

            const mapped = splitTokens.flatMap((token) => categoryTokenToKeys(token));

            const unique = [...new Set(mapped)];
            return unique.length > 0 ? unique : ['general'];
        }

        function formatAnswerText(text) {
            if (!text) {
                return '<span style="color:var(--text-muted);">&#22238;&#31572;&#28310;&#20633;&#20013;</span>';
            }

            let formatted = String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            const urlRegex = /(https?:\/\/[^\s<>"')]+)/g;
            formatted = formatted.replace(urlRegex, (url) =>
                `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:var(--color-primary);text-decoration:underline;word-break:break-all;">${url}</a>`
            );
            return formatted.replace(/\n/g, '<br>');
        }

        function renderQAList(data) {
            const container = document.getElementById('qaList');
            if (!container) return;

            if (!data.length) {
                container.innerHTML = '<p class="no-results" id="noResults" style="display:block;">No Q&amp;A found</p>';
                return;
            }

            container.innerHTML = data.map((item) => `
                <article class="qa-item" data-categories="${item.categories.join(',')}" data-keywords="${item.keywords}">
                    <div class="qa-question" onclick="toggleQA(this)">
                        <span class="qa-question-icon">Q</span>
                        <span class="qa-question-text">${item.question}</span>
                        <span class="qa-toggle-icon">▼</span>
                    </div>
                    <div class="qa-answer">
                        <span class="qa-answer-icon">A</span>
                        <span class="qa-answer-text">${formatAnswerText(item.answer)}</span>
                    </div>
                </article>
            `).join('');

            container.insertAdjacentHTML('beforeend', '<p class="no-results" id="noResults" style="display:none;">No Q&amp;A found</p>');
        }

        function filterQA() {
            const searchTerm = String(document.getElementById('qaSearchInput')?.value || '').toLowerCase();
            const activeCategory = document.querySelector('.qa-tab.active')?.dataset.category || 'all';
            const items = document.querySelectorAll('.qa-item');
            let visibleCount = 0;

            items.forEach((item) => {
                const q = item.querySelector('.qa-question-text')?.textContent.toLowerCase() || '';
                const a = item.querySelector('.qa-answer-text')?.textContent.toLowerCase() || '';
                const k = (item.dataset.keywords || '').toLowerCase();
                const categories = (item.dataset.categories || 'general')
                    .split(',')
                    .map((s) => s.trim())
                    .filter(Boolean);

                const matchesSearch = !searchTerm || q.includes(searchTerm) || a.includes(searchTerm) || k.includes(searchTerm);
                const matchesCategory = activeCategory === 'all' || categories.includes(activeCategory);
                const visible = matchesSearch && matchesCategory;

                item.style.display = visible ? 'block' : 'none';
                if (visible) visibleCount += 1;
            });

            const noResults = document.getElementById('noResults');
            if (noResults) noResults.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        function extractRowValue(row, keys) {
            for (const key of keys) {
                if (row[key] !== undefined && row[key] !== null) {
                    const value = String(row[key]).trim();
                    if (value) return value;
                }
            }
            return '';
        }

        function parseRows(rows) {
            return rows.map((row) => {
                const question = extractRowValue(row, ['Question', '\u8cea\u554f']);
                const answer = extractRowValue(row, ['Answer', '\u56de\u7b54']);
                // Category filtering is based on E column only.
                const categoryRaw = extractRowValue(row, ['Category']);
                const keywords = extractRowValue(row, ['Keyword', '\u30ad\u30fc\u30ef\u30fc\u30c9']);
                return { question, answer, categories: getCategoriesFromData(categoryRaw), keywords };
            }).filter((item) => item.question);
        }

        function parseCsvUrl(url) {
            return new Promise((resolve, reject) => {
                Papa.parse(appendCacheBuster(url), {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: (h) => String(h || '').trim(),
                    complete: (results) => {
                        const parsed = parseRows(results.data || []);
                        if (parsed.length > 0) resolve(parsed);
                        else reject(new Error('No valid rows'));
                    },
                    error: reject
                });
            });
        }

        function parseEmbeddedCsv(csvText) {
            return new Promise((resolve, reject) => {
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: (h) => String(h || '').trim(),
                    complete: (results) => {
                        const parsed = parseRows(results.data || []);
                        if (parsed.length > 0) resolve(parsed);
                        else reject(new Error('No valid embedded rows'));
                    },
                    error: reject
                });
            });
        }

        function logCategorySummary(data) {
            const summary = {
                all: data.length,
                insurance: 0,
                treatment: 0,
                transport: 0,
                test: 0,
                nutrition: 0,
                shunt: 0,
                schedule: 0,
                lifestyle: 0,
                disaster: 0,
                general: 0
            };
            data.forEach((item) => {
                (item.categories || []).forEach((cat) => {
                    if (summary[cat] !== undefined) summary[cat] += 1;
                });
            });
            console.log('Q&A category summary', summary);
        }

        async function loadQAData() {
            const container = document.getElementById('qaList');
            if (!container) return;
            container.innerHTML = '<p class="no-results">Q&amp;A loading...</p>';

            const urls = window.QA_SOURCE_URLS || {};
            const candidates = [urls.remoteCsvUrl, urls.localCsvUrl].filter(Boolean);
            const errors = [];

            for (const url of candidates) {
                try {
                    qaMasterData = await parseCsvUrl(url);
                    renderQAList(qaMasterData);
                    logCategorySummary(qaMasterData);
                    return;
                } catch (error) {
                    errors.push(error);
                }
            }

            if (typeof QA_CSV_CONTENT === 'string' && QA_CSV_CONTENT.trim()) {
                try {
                    qaMasterData = await parseEmbeddedCsv(QA_CSV_CONTENT);
                    renderQAList(qaMasterData);
                    logCategorySummary(qaMasterData);
                    return;
                } catch (error) {
                    errors.push(error);
                }
            }

            console.error('Q&A load failed', errors);
            container.innerHTML = '<p class="no-results" style="display:block;">Q&amp;A data load failed.</p>';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('categoryTabs')?.addEventListener('click', (e) => {
                if (!e.target.classList.contains('qa-tab')) return;
                document.querySelectorAll('.qa-tab').forEach((tab) => tab.classList.remove('active'));
                e.target.classList.add('active');
                filterQA();
            });

            document.getElementById('qaSearchInput')?.addEventListener('input', filterQA);
            await loadQAData();

            const logo = document.querySelector('.header-logo');
            if (logo && document.referrer) {
                const ref = document.referrer.toLowerCase();
                if (ref.includes('disaster')) logo.href = 'disaster-main.html';
                else if (ref.includes('friend')) logo.href = 'friend-main.html';
            }
        });
    </script>
</body>
</html>
