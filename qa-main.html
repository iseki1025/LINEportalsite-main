<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Q&amp;A検索 | 梶本クリニック</title>

    <script src="js/page-transition.js?v=20260915-fade4"></script>

    <link rel="stylesheet" href="representative-pages.css">

<body class="page-qa">
    <a class="skip-link" href="#main-content">本文へ移動</a>
    <div class="app-container">
    <header class="app-header">
        <a href="index.html" class="header-logo" aria-label="梶本クリニック ポータルへ戻る">
            <img src="files/common/kajimoto_rogo2.svg" alt="梶本クリニック">
        </a>
        <div class="header-center">
            <div class="header-title">Q&amp;A検索</div>
        </div>
    </header>

    <main id="main-content" class="main-content">
        <section class="hero-section" aria-labelledby="qa-page-title">
            <p class="hero-badge">よくある質問</p>
            <h1 id="qa-page-title" class="hero-title">Q&amp;A検索</h1>
            <p class="hero-description">キーワードやカテゴリーから、知りたい情報を探せます。</p>
        </section>

        <section class="search-panel" aria-labelledby="qa-search-title">
            <h2 id="qa-search-title" class="field-label">キーワードで検索</h2>
            <input type="search" class="search-input" id="qaSearchInput" placeholder="キーワードで検索..." autocomplete="off">

            <p class="popular-keywords-label">
                よく検索されるキーワード
            </p>
            <div class="keyword-buttons" id="keywordButtons">
                <button type="button" class="keyword-btn" onclick="setKeyword('食事')">食事</button>
                <button type="button" class="keyword-btn" onclick="setKeyword('診療時間')">診療時間</button>
                <button type="button" class="keyword-btn" onclick="setKeyword('生活習慣')">生活習慣</button>
                <button type="button" class="keyword-btn" onclick="setKeyword('シャント')">シャント</button>
                <button type="button" class="keyword-btn" onclick="setKeyword('送迎')">送迎</button>
                <button type="button" class="keyword-btn" onclick="setKeyword('検査')">検査</button>
            </div>
        </section>

        <p class="category-filter-label" id="category-filter-label">
            カテゴリで絞り込み:
        </p>
        <div class="qa-category-tabs" id="categoryTabs" role="group" aria-labelledby="category-filter-label">
            <button type="button" class="qa-tab active" aria-pressed="true" data-category="all">すべて</button>
            <button type="button" class="qa-tab" aria-pressed="false" data-category="insurance">保険・費用</button>
            <button type="button" class="qa-tab" aria-pressed="false" data-category="treatment">治療</button>
            <button type="button" class="qa-tab" aria-pressed="false" data-category="transport">送迎</button>
            <button type="button" class="qa-tab" aria-pressed="false" data-category="test">検査</button>
            <button type="button" class="qa-tab" aria-pressed="false" data-category="nutrition">食事</button>
            <button type="button" class="qa-tab" aria-pressed="false" data-category="shunt">シャント</button>
            <button type="button" class="qa-tab" aria-pressed="false" data-category="schedule">診療時間</button>
            <button type="button" class="qa-tab" aria-pressed="false" data-category="lifestyle">生活習慣</button>
            <button type="button" class="qa-tab" aria-pressed="false" data-category="disaster">災害</button>
        </div>

        <div class="qa-list" id="qaList" aria-busy="true">
            <p class="no-results">Q&amp;Aを読み込んでいます...</p>
        </div>

        <div class="back-btn-container">
            <a href="friend-main.html" class="btn btn-secondary">
                お友達特典ポータルへ戻る
            </a>
        </div>
    </main>

    <footer class="app-footer">
        <a href="index.html" class="stealth-link">© 2026 Kajimoto Clinic</a>
    </footer>

    <nav class="bottom-nav" aria-label="主要ナビゲーション">
        <a class="nav-item" href="friend-main.html">
            <svg aria-hidden="true"><use href="assets/icons/support-icons.svg#home"></use></svg>
            <span>特典トップ</span>
        </a>
        <a class="nav-item active" href="qa-main.html" aria-current="page">
            <svg aria-hidden="true"><use href="assets/icons/support-icons.svg#qna"></use></svg>
            <span>Q&amp;A</span>
        </a>
    </nav>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="js/qa/qa-source.js"></script>
    <script src="js/qa/qa-data-embedded.js"></script>
    <script>
        let qaMasterData = [];

        function appendCacheBuster(url) {
            const separator = url.includes('?') ? '&' : '?';
            return `${url}${separator}t=${Date.now()}`;
        }

        function setKeyword(word) {
            const input = document.getElementById('qaSearchInput');
            if (!input) return;
            input.value = word;
            filterQA();
        }

        function toggleQA(element) {
            const item = element.closest('.qa-item');
            if (!item) return;
            const isOpen = item.classList.toggle('open');
            element.setAttribute('aria-expanded', String(isOpen));
        }

        function normalizeCategoryText(text) {
            return String(text || '').toLowerCase().replace(/\s+/g, '');
        }

        function categoryTokenToKeys(token) {
            const cat = normalizeCategoryText(token);
            if (!cat) return [];

            const keys = [];
            if (cat.includes('保険') || cat.includes('費用')) keys.push('insurance');
            if (cat.includes('治療')) keys.push('treatment');
            if (cat.includes('送迎')) keys.push('transport');
            if (cat.includes('検査')) keys.push('test');
            if (cat.includes('食事') || cat.includes('栄養')) keys.push('nutrition');
            if (cat.includes('シャント')) keys.push('shunt');
            if (cat.includes('診療時間') || cat.includes('スケジュール')) keys.push('schedule');
            if (cat.includes('生活習慣') || cat.includes('ライフスタイル')) keys.push('lifestyle');
            if (cat.includes('災害')) keys.push('disaster');
            return keys;
        }

        function getCategoriesFromData(categoryField) {
            const raw = String(categoryField || '');
            const splitTokens = raw
                .split(/[,\u3001\uFF0C\/\uFF0F|\n\r;\uFF1B\u30FB]+/)
                .map((s) => s.trim())
                .filter(Boolean);

            const mapped = splitTokens.flatMap((token) => categoryTokenToKeys(token));

            const unique = [...new Set(mapped)];
            return unique.length > 0 ? unique : ['general'];
        }

        function formatAnswerText(text) {
            if (!text) {
                return '<span class="answer-pending">回答準備中</span>';
            }

            let formatted = String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            const urlRegex = /(https?:\/\/[^\s<>"')]+)/g;
            formatted = formatted.replace(urlRegex, (url) =>
                `<a href="${url}" target="_blank" rel="noopener noreferrer" class="qa-answer-link">${url}</a>`
            );
            return formatted.replace(/\n/g, '<br>');
        }

        function renderQAList(data) {
            const container = document.getElementById('qaList');
            if (!container) return;

            if (!data.length) {
                container.innerHTML = '<p class="no-results" id="noResults">該当するQ&amp;Aが見つかりません</p>';
                container.setAttribute('aria-busy', 'false');
                return;
            }

            container.innerHTML = data.map((item, index) => `
                <article class="qa-item"
                    data-categories="${item.categories.join(',')}"
                    data-category-raw="${item.categoryRaw}"
                    data-keywords="${item.keywords}">
                    <button type="button" class="qa-question" onclick="toggleQA(this)"
                        aria-expanded="false" aria-controls="qa-answer-${index}">
                        <span class="qa-question-icon" aria-hidden="true">Q</span>
                        <span class="qa-question-text">${item.question}</span>
                        <span class="qa-toggle-icon" aria-hidden="true">▼</span>
                    </button>
                    <div class="qa-answer" id="qa-answer-${index}">
                        <span class="qa-answer-icon" aria-hidden="true">A</span>
                        <span class="qa-answer-text">${formatAnswerText(item.answer)}</span>
                    </div>
                </article>
            `).join('');

            container.insertAdjacentHTML('beforeend', '<p class="no-results" id="noResults" hidden>該当するQ&amp;Aが見つかりません</p>');
            container.setAttribute('aria-busy', 'false');
        }

        function filterQA() {
            const searchTerm = String(document.getElementById('qaSearchInput')?.value || '').toLowerCase();
            const activeCategory = document.querySelector('.qa-tab.active')?.dataset.category || 'all';
            const items = document.querySelectorAll('.qa-item');
            let visibleCount = 0;

            items.forEach((item) => {
                const q = item.querySelector('.qa-question-text')?.textContent.toLowerCase() || '';
                const a = item.querySelector('.qa-answer-text')?.textContent.toLowerCase() || '';
                const categoryRaw = (item.dataset.categoryRaw || '').toLowerCase();
                const keywords = (item.dataset.keywords || '').toLowerCase();
                const categories = (item.dataset.categories || 'general')
                    .split(',')
                    .map((s) => s.trim())
                    .filter(Boolean);

                // CSVのE列(Category)とG列(Keyword)も含めて部分一致で検索する
                const matchesSearch = !searchTerm
                    || q.includes(searchTerm)
                    || a.includes(searchTerm)
                    || categoryRaw.includes(searchTerm)
                    || keywords.includes(searchTerm);
                const matchesCategory = activeCategory === 'all' || categories.includes(activeCategory);
                const visible = matchesSearch && matchesCategory;

                item.style.display = visible ? 'block' : 'none';
                if (visible) visibleCount += 1;
            });

            const noResults = document.getElementById('noResults');
            if (noResults) noResults.hidden = visibleCount !== 0;
        }

        function extractRowValue(row, keys) {
            for (const key of keys) {
                if (row[key] !== undefined && row[key] !== null) {
                    const value = String(row[key]).trim();
                    if (value) return value;
                }
            }
            return '';
        }

        function parseRows(rows) {
            return rows.map((row) => {
                const question = extractRowValue(row, ['Question', '\u8cea\u554f']);
                const answer = extractRowValue(row, ['Answer', '\u56de\u7b54']);
                // Category filtering is based on E column only.
                const categoryRaw = extractRowValue(row, ['Category']);
                const keywords = extractRowValue(row, ['Keyword', '\u30ad\u30fc\u30ef\u30fc\u30c9']);
                return { question, answer, categoryRaw, categories: getCategoriesFromData(categoryRaw), keywords };
            }).filter((item) => item.question);
        }

        function parseCsvUrl(url) {
            return new Promise((resolve, reject) => {
                Papa.parse(appendCacheBuster(url), {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: (h) => String(h || '').trim(),
                    complete: (results) => {
                        const parsed = parseRows(results.data || []);
                        if (parsed.length > 0) resolve(parsed);
                        else reject(new Error('No valid rows'));
                    },
                    error: reject
                });
            });
        }

        function parseEmbeddedCsv(csvText) {
            return new Promise((resolve, reject) => {
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: (h) => String(h || '').trim(),
                    complete: (results) => {
                        const parsed = parseRows(results.data || []);
                        if (parsed.length > 0) resolve(parsed);
                        else reject(new Error('No valid embedded rows'));
                    },
                    error: reject
                });
            });
        }

        function logCategorySummary(data) {
            const summary = {
                all: data.length,
                insurance: 0,
                treatment: 0,
                transport: 0,
                test: 0,
                nutrition: 0,
                shunt: 0,
                schedule: 0,
                lifestyle: 0,
                disaster: 0,
                general: 0
            };
            data.forEach((item) => {
                (item.categories || []).forEach((cat) => {
                    if (summary[cat] !== undefined) summary[cat] += 1;
                });
            });
            console.log('Q&A category summary', summary);
        }

        async function loadQAData() {
            const container = document.getElementById('qaList');
            if (!container) return;
            container.setAttribute('aria-busy', 'true');
            container.innerHTML = '<p class="no-results">Q&amp;Aを読み込んでいます...</p>';

            const urls = window.QA_SOURCE_URLS || {};
            const candidates = [urls.remoteCsvUrl, urls.localCsvUrl].filter(Boolean);
            const errors = [];

            for (const url of candidates) {
                try {
                    qaMasterData = await parseCsvUrl(url);
                    renderQAList(qaMasterData);
                    logCategorySummary(qaMasterData);
                    return;
                } catch (error) {
                    errors.push(error);
                }
            }

            if (typeof QA_CSV_CONTENT === 'string' && QA_CSV_CONTENT.trim()) {
                try {
                    qaMasterData = await parseEmbeddedCsv(QA_CSV_CONTENT);
                    renderQAList(qaMasterData);
                    logCategorySummary(qaMasterData);
                    return;
                } catch (error) {
                    errors.push(error);
                }
            }

            console.error('Q&A load failed', errors);
            container.innerHTML = '<p class="no-results">Q&amp;Aデータを読み込めませんでした。</p>';
            container.setAttribute('aria-busy', 'false');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('categoryTabs')?.addEventListener('click', (e) => {
                if (!e.target.classList.contains('qa-tab')) return;
                document.querySelectorAll('.qa-tab').forEach((tab) => {
                    tab.classList.remove('active');
                    tab.setAttribute('aria-pressed', 'false');
                });
                e.target.classList.add('active');
                e.target.setAttribute('aria-pressed', 'true');
                filterQA();
            });

            document.getElementById('qaSearchInput')?.addEventListener('input', filterQA);
            await loadQAData();

            const logo = document.querySelector('.header-logo');
            if (logo && document.referrer) {
                const ref = document.referrer.toLowerCase();
                if (ref.includes('disaster')) logo.href = 'disaster-main.html';
                else if (ref.includes('friend')) logo.href = 'friend-main.html';
            }
        });
    </script>

</body>
</html>
