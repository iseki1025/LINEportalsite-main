<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Q&A 検索 | 梶本クリニック</title>
    <link rel="stylesheet" href="portal-design.css">
    <style>
        /* Q&A specific styles */
        .qa-category-tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            overflow-x: auto;
            padding-bottom: var(--spacing-sm);
            -webkit-overflow-scrolling: touch;
        }

        .qa-tab {
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            transition: all var(--transition-fast);
            cursor: pointer;
        }

        .qa-tab:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .qa-tab.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: var(--text-inverse);
        }

        .qa-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .qa-item {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .qa-question {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-lg);
            cursor: pointer;
            transition: background var(--transition-fast);
        }

        .qa-question:hover {
            background: var(--bg-glass-dark);
        }

        .qa-question-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: var(--accent-qa);
            color: white;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .qa-question-text {
            flex: 1;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .qa-toggle-icon {
            color: var(--text-muted);
            transition: transform var(--transition-normal);
        }

        .qa-item.open .qa-toggle-icon {
            transform: rotate(180deg);
        }

        .qa-answer {
            display: none;
            padding: var(--spacing-md) var(--spacing-lg);
            padding-left: calc(var(--spacing-lg) + 28px + var(--spacing-md));
            background: var(--bg-main);
            border-top: 1px solid var(--border-light);
        }

        .qa-item.open .qa-answer {
            display: block;
        }

        .qa-answer-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: var(--color-primary);
            color: white;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.85rem;
            margin-right: var(--spacing-sm);
            vertical-align: top;
        }

        .qa-answer-text {
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .no-results {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <header class="app-header">
        <a href="index.html" class="header-logo">
            <img src="files/common/kajimoto_rogo2.svg" alt="梶本クリニック">
        </a>
        <div class="header-center">
            <div class="header-title">Q&A 検索</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Search -->
        <div class="search-container">
            <input type="text" class="search-input" id="qaSearchInput" placeholder="キーワードで検索...">

            <div style="font-size:0.8rem; color:var(--text-muted); margin-top:1rem; margin-bottom:0.5rem;">よく検索されるキーワード:
            </div>
            <div class="keyword-buttons" id="keywordButtons">
                <button class="keyword-btn" onclick="setKeyword('水分')">水分</button>
                <button class="keyword-btn" onclick="setKeyword('塩分')">塩分</button>
                <button class="keyword-btn" onclick="setKeyword('シャント')">シャント</button>
                <button class="keyword-btn" onclick="setKeyword('運動')">運動</button>
                <button class="keyword-btn" onclick="setKeyword('緊急')">緊急</button>
            </div>
        </div>

        <!-- Category Tabs -->
        <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.5rem; padding-left:0.25rem;">カテゴリで絞り込み:
        </div>
        <div class="qa-category-tabs" id="categoryTabs">
            <button class="qa-tab active" data-category="all">すべて</button>
            <button class="qa-tab" data-category="nutrition">食事</button>
            <button class="qa-tab" data-category="shunt">シャント</button>
            <button class="qa-tab" data-category="exercise">運動</button>
            <button class="qa-tab" data-category="disaster">災害</button>
        </div>

        <!-- Q&A List -->
        <div class="qa-list" id="qaList">
            <p class="no-results">読み込み中...</p>
        </div>

        <!-- Copyright -->
        <footer class="copyright">
            <a href="index.html" class="stealth-link">
                © 2025 Kajimoto Clinic
            </a>
        </footer>

    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="js/qa/qa-data-embedded.js"></script>
    <script src="js/qa/qa-script.js"></script>
    <script>
        // カテゴリ切り替え（タブ選択時はブラウザの input イベントを模倣して qa-script.js を動かす）
        function setCategory(category) {
            const tabs = document.querySelectorAll('.qa-category-tab');
            tabs.forEach(tab => {
                if (tab.textContent === category) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            const searchInput = document.querySelector('.qa-search-input');
            const section = document.querySelector('.qa-search-section');
            if (section && searchInput) {
                // セクションのデータ属性を書き換えて、検索トリガーを引く
                section.setAttribute('data-category', category);
                // カテゴリ切り替え時は一旦検索ワードをクリアして全件表示（フィルタのみ）にすることが多い
                searchInput.value = '';
                searchInput.dispatchEvent(new Event('input', { bubbles: true }));
            }
        }

        function setKeyword(word) {
            const input = document.querySelector('.qa-search-input');
            if (input) {
                input.value = word;
                input.dispatchEvent(new Event('input', { bubbles: true }));
            }
        }
    </script>

</body>

</html>
