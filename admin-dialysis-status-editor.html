<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>透析状況更新 - 梶本クリニック 統合管理システム</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components.css">
    <style>
        .status-editor-grid {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            margin-bottom: 2rem;
        }

        .facility-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 2px solid #e5e7eb;
        }

        .facility-card.available {
            border-color: #10b981;
        }

        .facility-card.unavailable {
            border-color: #ef4444;
        }

        .facility-card.checking {
            border-color: #64748b;
        }

        .facility-card.conditional {
            border-color: #f59e0b;
        }

        .status-toggle {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .status-toggle label {
            cursor: pointer;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            border: 2px solid #e5e7eb;
            font-weight: bold;
            font-size: 0.9rem;
            flex: 1;
            text-align: center;
            white-space: nowrap;
        }

        .status-toggle input[type="radio"]:checked+label.radio-ok {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }

        .status-toggle input[type="radio"]:checked+label.radio-ng {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        .status-toggle input[type="radio"]:checked+label.radio-waiting {
            background: #64748b;
            color: white;
            border-color: #64748b;
        }

        .status-toggle input[type="radio"]:checked+label.radio-conditional {
            background: #f59e0b;
            color: white;
            border-color: #f59e0b;
        }

        .status-toggle input[type="radio"] {
            display: none;
        }
    </style>
</head>

<body class="admin-body">
    <header class="admin-header">
        <div class="admin-header-left">
            <button onclick="transitionNavigate('admin-dashboard.html')" class="btn-logout" style="margin-right:1rem;">←
                戻る</button>
            <h1>💉 透析状況更新</h1>
        </div>
        <div class="admin-header-right">
            <button id="logoutBtn" class="btn-logout">ログアウト</button>
        </div>
    </header>

    <main class="admin-container">
        <section class="editor-section">
            <h2>各施設の状況を選択</h2>
            <p>更新後、災害情報ページに即座に反映されます。</p>

            <div id="statusGrid" class="status-editor-grid">
                <!-- JSで生成 -->
            </div>

            <div style="text-align: center; margin-top: 2rem;">
                <button id="updateBatchBtn" class="btn-primary"
                    style="padding: 1rem 3rem; font-size: 1.2rem;">全ての状況を更新する</button>
            </div>
            <div id="lastUpdateInfo" class="qa-meta" style="text-align: center; margin-top: 1rem;"></div>
        </section>
    </main>

    <script type="module">
        import { requireAuth } from './js/admin/auth-guard.js';
        import { requirePermission } from './js/admin/permission-check.js';
        import { showSuccess, confirmAction, showLoading } from './js/admin/ui-helper.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, Timestamp, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { firebaseConfig } from './js/firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const user = await requireAuth();
        await requirePermission('dialysisStatus');

        const statusGrid = document.getElementById('statusGrid');
        const updateBatchBtn = document.getElementById('updateBatchBtn');
        const lastUpdateInfo = document.getElementById('lastUpdateInfo');

        const facilities = ["本院", "なかもず分院", "三国ヶ丘分院"];
        let currentData = {};

        async function loadStatus() {
            showLoading(statusGrid);
            try {
                const snapshot = await getDocs(collection(db, 'dialysis_status'));
                snapshot.forEach(doc => {
                    currentData[doc.id] = doc.data();
                });

                renderStatusCards();
            } catch (error) {
                console.error('Load status error:', error);
                statusGrid.innerHTML = '<p>データの読み込みに失敗しました。</p>';
            }
        }

        function renderStatusCards() {
            statusGrid.innerHTML = facilities.map(name => {
                const data = currentData[name] || { status: 'available', reason: '' };
                const status = data.status || 'available';

                return `
          <div class="facility-card ${status}" id="card-${name}">
            <h3>${name}</h3>
            <div class="status-toggle">
              <input type="radio" name="status-${name}" id="ok-${name}" value="available" ${status === 'available' ? 'checked' : ''} onchange="window.handleStatusChange('${name}', 'available')">
              <label for="ok-${name}" class="radio-ok">透析可</label>
              
              <input type="radio" name="status-${name}" id="conditional-${name}" value="conditional" ${status === 'conditional' ? 'checked' : ''} onchange="window.handleStatusChange('${name}', 'conditional')">
              <label for="conditional-${name}" class="radio-conditional">条件付き可</label>

              <input type="radio" name="status-${name}" id="waiting-${name}" value="checking" ${status === 'checking' ? 'checked' : ''} onchange="window.handleStatusChange('${name}', 'checking')">
              <label for="waiting-${name}" class="radio-waiting">確認中</label>

              <input type="radio" name="status-${name}" id="ng-${name}" value="unavailable" ${status === 'unavailable' ? 'checked' : ''} onchange="window.handleStatusChange('${name}', 'unavailable')">
              <label for="ng-${name}" class="radio-ng">透析不可</label>
            </div>
            <div id="reason-group-${name}" style="display: ${status === 'available' ? 'none' : 'block'}">
              <div class="form-group" style="margin-bottom: 1rem;">
                <label>一言メッセージ（例：一部患者様の時間変更あり）</label>
                <input type="text" id="short-message-${name}" value="${data.short_message || ''}" placeholder="30文字以内で入力">
              </div>
              <div class="form-group">
                <label>詳細ガイドライン（長文・改行可）</label>
                <textarea id="reason-${name}" placeholder="詳細な対応内容を入力してください" style="width: 100%; min-height: 80px; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px;">${data.reason || ''}</textarea>
              </div>
            </div>
          </div>
        `;
            }).join('');

            // 最終更新情報の表示
            const latest = Object.values(currentData).sort((a, b) => b.updatedAt?.toMillis() - a.updatedAt?.toMillis())[0];
            if (latest) {
                lastUpdateInfo.textContent = `最終更新: ${latest.updatedAt?.toDate().toLocaleString()} (担当: ${latest.updatedByDisplayName || latest.updatedBy})`;
            }
        }

        window.handleStatusChange = (name, status) => {
            const group = document.getElementById(`reason-group-${name}`);
            const card = document.getElementById(`card-${name}`);
            const isOk = (status === 'available');
            group.style.display = isOk ? 'none' : 'block';
            card.className = `facility-card ${status}`;
        };

        updateBatchBtn.addEventListener('click', async () => {
            updateBatchBtn.disabled = true;
            updateBatchBtn.textContent = '更新中...';

            try {
                for (const name of facilities) {
                    const status = document.querySelector(`input[name="status-${name}"]:checked`).value;
                    const shortMessage = document.getElementById(`short-message-${name}`).value;
                    const reason = document.getElementById(`reason-${name}`).value;

                    await setDoc(doc(db, 'dialysis_status', name), {
                        facility: name,
                        status: status,
                        short_message: status === 'available' ? '' : shortMessage,
                        reason: status === 'available' ? '' : reason,
                        updatedAt: Timestamp.now(),
                        updatedBy: user.uid,
                        updatedByDisplayName: user.displayName
                    });
                }
                showSuccess('全ての状況を更新しました');
                loadStatus();
            } catch (error) {
                console.error('Update error:', error);
                alert('更新中にエラーが発生しました');
            } finally {
                updateBatchBtn.disabled = false;
                updateBatchBtn.textContent = '全ての状況を更新する';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (confirmAction('ログアウトしますか？')) {
                await signOut(auth);
                transitionNavigate('admin-login.html', { replace: true });
            }
        });

        loadStatus();
    </script>
    <script src="js/page-transition.js"></script>

</body>

</html>
