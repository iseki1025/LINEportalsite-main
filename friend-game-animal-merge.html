<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ぷにぷにアニマル・マージ</title>
    <script src="js/page-transition-bootstrap.js?v=20260915-fade4"></script>
    <script src="js/page-transition.js?v=20260915-fade4"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components.css">
    <style>
        /* ===== 基本リセット ===== */
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        /* ===== レイヤー1: 背景 ===== */
        .game-bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #e0c3fc 0%, #c9b1ff 25%, #b8d4e3 50%, #b5ead7 75%, #ffc8dd 100%);
            z-index: 0;
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.4;
            animation: float-up 8s infinite linear;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 0.4;
            }

            90% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(-20vh) scale(1);
                opacity: 0;
            }
        }

        /* ===== レイヤー2: ゲーム本体 (中央配置) ===== */
        .game-main {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px 20px;
            box-sizing: border-box;
        }

        .game-box {
            position: relative;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.1) 100%);
            border: 4px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
        }

        .game-box canvas {
            display: block;
            background: transparent;
        }

        .deadline {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 100, 100, 0.6), transparent);
            z-index: 10;
        }

        .deadline::before {
            content: '⚠️';
            position: absolute;
            right: 5px;
            top: -10px;
            font-size: 0.7rem;
        }

        .glass-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            border-radius: 16px;
        }

        /* ゲームオーバー */
        .game-over-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            border-radius: 16px;
            z-index: 100;
        }

        .game-over-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .game-over-overlay h2 {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }

        .game-over-overlay p {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* ===== レイヤー3: HUD (固定オーバーレイ) ===== */
        .game-hud {
            position: fixed;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 15px 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .hud-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .hud-label {
            font-size: 0.6rem;
            color: #888;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hud-separator {
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(160, 140, 200, 0.3), transparent);
            margin: 0 auto;
        }

        #nextCanvas {
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.5);
        }

        /* ===== 固定UI要素 ===== */
        .unified-back-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s;
            font-family: "Noto Sans JP", sans-serif;
        }

        .unified-back-btn:active {
            transform: scale(0.95);
        }

        .game-title {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            margin: 0;
            font-size: 1.1rem;
            z-index: 50;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            background: linear-gradient(135deg, #ff9a9e, #a18cd1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            pointer-events: none;
        }

        .game-controls {
            position: fixed;
            bottom: 20px;
            right: 15px;
            z-index: 100;
        }

        .game-btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: "Noto Sans JP", sans-serif;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(161, 140, 209, 0.4);
        }

        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(161, 140, 209, 0.5);
        }

        .game-btn:active {
            transform: translateY(0);
        }

        /* マージエフェクト */
        .merge-effect {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 200, 220, 0.4) 50%, transparent 70%);
            animation: merge-pop 0.4s ease-out forwards;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes merge-pop {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.8;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* ===== アニマル・マージ専用レスポンシブレイアウト ===== */
        :root {
            --game-purple: #8e72bd;
            --game-blue: #255c88;
            --game-card: rgba(255, 255, 255, 0.86);
            --game-border: rgba(255, 255, 255, 0.78);
            --game-shadow: 0 12px 30px rgba(49, 79, 112, 0.16);
        }

        html,
        body {
            min-height: 100%;
            height: auto;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: manipulation;
        }

        body {
            min-height: 100dvh;
            color: var(--game-blue);
            font-family: "Noto Sans JP", sans-serif;
        }

        .game-bg,
        .particles {
            position: fixed;
            inset: 0;
        }

        .game-app {
            position: relative;
            z-index: 10;
            min-height: 100dvh;
            box-sizing: border-box;
            padding-bottom: calc(18px + env(safe-area-inset-bottom));
        }

        .game-header {
            display: grid;
            grid-template-columns: minmax(90px, 1fr) auto minmax(90px, 1fr);
            align-items: center;
            gap: 12px;
            width: min(100%, 1120px);
            box-sizing: border-box;
            margin: 0 auto;
            padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
        }

        .game-header .unified-back-btn {
            position: static;
            justify-self: start;
            min-width: 88px;
            min-height: 44px;
            box-sizing: border-box;
            padding: 8px 16px;
            color: var(--game-blue);
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 999px;
            box-shadow: 0 6px 16px rgba(50, 80, 112, 0.12);
            font-size: 0.9rem;
            text-align: center;
            white-space: nowrap;
        }

        .game-title {
            position: static;
            grid-column: 2;
            width: auto;
            margin: 0;
            font-size: clamp(1rem, 2.2vw, 1.35rem);
            line-height: 1.25;
            color: var(--game-blue);
            background: none;
            -webkit-text-fill-color: currentColor;
            text-align: center;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.72);
        }

        .game-main {
            position: static;
            inset: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            box-sizing: border-box;
            width: 100%;
            min-height: 0;
            padding: 8px max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
        }

        .game-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-areas:
                "hud"
                "board"
                "controls";
            align-items: center;
            justify-items: center;
            gap: clamp(12px, 2.2vh, 22px);
            width: min(100%, 1120px);
        }

        .game-box {
            grid-area: board;
            width: min(350px, calc(100vw - 24px));
            max-width: 100%;
            height: auto;
            aspect-ratio: 350 / 550;
            box-sizing: content-box;
            border: 4px solid var(--game-border);
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.12));
            box-shadow: var(--game-shadow), inset 0 2px 4px rgba(255, 255, 255, 0.34);
            touch-action: none;
        }

        .game-box canvas#gameCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .deadline {
            top: 10.91%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 100, 100, 0.62), transparent);
        }

        .game-hud {
            position: static;
            grid-area: hud;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: space-evenly;
            gap: 8px;
            width: min(100%, 560px);
            box-sizing: border-box;
            padding: 10px 12px;
            transform: none;
            background: var(--game-card);
            border: 1px solid var(--game-border);
            border-radius: 18px;
            box-shadow: var(--game-shadow);
        }

        .hud-section {
            flex: 1 1 0;
            min-width: 0;
            justify-content: center;
            gap: 4px;
        }

        .hud-label {
            color: #6d7180;
            font-size: clamp(0.58rem, 1.8vw, 0.7rem);
            letter-spacing: 0.12em;
        }

        .hud-value {
            color: var(--game-purple);
            background: none;
            -webkit-text-fill-color: currentColor;
            font-size: clamp(1rem, 4vw, 1.35rem);
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            white-space: nowrap;
        }

        .hud-separator {
            flex: 0 0 1px;
            width: 1px;
            height: auto;
            margin: 4px 0;
            background: linear-gradient(180deg, transparent, rgba(160, 140, 200, 0.32), transparent);
        }

        #nextCanvas {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
        }

        .game-controls {
            position: static;
            grid-area: controls;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .game-btn {
            min-height: 48px;
            padding: 11px 28px;
            font-size: 1rem;
            color: #fff;
            background: linear-gradient(135deg, #8f78c7 0%, #e6a8d5 100%);
            box-shadow: 0 6px 16px rgba(142, 114, 189, 0.32);
        }

        .game-btn:focus-visible,
        .game-header .unified-back-btn:focus-visible {
            outline: 3px solid rgba(48, 125, 183, 0.45);
            outline-offset: 3px;
        }

        .game-over-overlay {
            border-radius: 18px;
            background: rgba(44, 52, 75, 0.78);
        }

        .game-over-overlay h2 {
            margin: 0 0 10px;
            font-size: clamp(1.4rem, 6vw, 1.8rem);
        }

        .game-over-overlay p {
            margin: 0 0 20px;
            font-size: 1.05rem;
        }

        @media (min-width: 900px) {
            .game-layout {
                grid-template-columns: minmax(350px, 1fr) minmax(230px, 290px);
                grid-template-areas:
                    "board hud"
                    "board controls";
                align-content: center;
                justify-items: stretch;
                column-gap: clamp(24px, 5vw, 72px);
                row-gap: 18px;
            }

            .game-hud {
                flex-direction: column;
                justify-self: center;
                width: min(100%, 260px);
                padding: 18px 14px;
            }

            .hud-separator {
                flex: 0 0 1px;
                width: 80%;
                height: 1px;
                margin: 0 auto;
                background: linear-gradient(90deg, transparent, rgba(160, 140, 200, 0.32), transparent);
            }

            .game-controls {
                justify-self: center;
                width: auto;
            }
        }

        @media (orientation: landscape) and (max-width: 899px) and (max-height: 620px) {
            .game-layout {
                grid-template-columns: minmax(280px, auto) minmax(210px, 1fr);
                grid-template-areas:
                    "board hud"
                    "board controls";
                justify-content: center;
                column-gap: 22px;
            }

            .game-hud {
                flex-direction: column;
                width: min(100%, 240px);
            }

            .hud-separator {
                flex: 0 0 1px;
                width: 80%;
                height: 1px;
                margin: 0 auto;
                background: linear-gradient(90deg, transparent, rgba(160, 140, 200, 0.32), transparent);
            }

            .game-controls {
                width: auto;
            }
        }

        @media (max-width: 380px) {
            .game-header {
                grid-template-columns: minmax(78px, 1fr) auto minmax(78px, 1fr);
                gap: 6px;
                padding-right: 10px;
                padding-left: 10px;
            }

            .game-header .unified-back-btn {
                min-width: 78px;
                padding-right: 10px;
                padding-left: 10px;
                font-size: 0.82rem;
            }

            .game-title {
                font-size: 0.8rem;
                letter-spacing: -0.03em;
                white-space: nowrap;
            }

            .game-hud {
                padding-right: 8px;
                padding-left: 8px;
            }

            #nextCanvas {
                width: 50px;
                height: 50px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .particle,
            .merge-effect,
            .game-over-overlay,
            .game-btn {
                animation: none;
                transition: none;
            }
        }
    </style>

</head>

<body class="theme-friend page-game-shell">
    <!-- レイヤー1: 背景 -->
    <div class="game-bg"></div>
    <div class="particles" id="particles"></div>

    <div class="game-app">
        <!-- ヘッダー -->
        <header class="game-header">
            <a href="friend-game-main.html" class="unified-back-btn">← 戻る</a>
            <h1 class="game-title">🐾 ぷにぷにアニマル</h1>
            <span aria-hidden="true"></span>
        </header>

        <!-- ゲーム本体: HUD・盤面・操作を同じレイアウトで管理 -->
        <main class="game-main">
            <div class="game-layout">
                <div class="game-box" id="gameBox">
                    <div class="deadline"></div>
                    <canvas id="gameCanvas"></canvas>
                    <div class="glass-overlay"></div>
                    <div class="game-over-overlay" id="gameOverOverlay" aria-live="polite">
                        <h2>🎮 Game Over</h2>
                        <p>スコア: <span id="finalScore">0</span></p>
                        <button class="game-btn" id="restartBtn">もう一度</button>
                    </div>
                </div>

                <div class="game-hud" aria-label="ゲーム情報">
                    <div class="hud-section">
                        <span class="hud-label">NEXT</span>
                        <canvas id="nextCanvas" width="64" height="64"></canvas>
                    </div>
                    <div class="hud-separator" aria-hidden="true"></div>
                    <div class="hud-section">
                        <span class="hud-label">BEST</span>
                        <span class="hud-value" id="bestScore">0</span>
                    </div>
                    <div class="hud-separator" aria-hidden="true"></div>
                    <div class="hud-section">
                        <span class="hud-label">SCORE</span>
                        <span class="hud-value" id="score">0</span>
                    </div>
                </div>

                <div class="game-controls">
                    <button class="game-btn" id="startBtn">スタート</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Matter.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <script>
        // ============================================
        // ぷにぷにアニマル・マージ - Game Engine
        // ============================================

        // --- Matter.js モジュール ---
        const { Engine, Render, Runner, Bodies, Body, World, Events, Query } = Matter;

        // --- 定数 (可変) ---
        const CANVAS_WIDTH = 350;
        const CANVAS_HEIGHT = 550;
        const ASPECT_RATIO = 350 / 550;
        const WALL_THICKNESS = 20;
        const DEADLINE_Y = 60;
        const DANGER_TIME = 3000;

        // --- 動物定義 (基準) ---
        const BASE_ANIMALS = [
            { name: 'ヒヨコ', radius: 18, color: '#FFE066', earColor: '#FFD700', bodyColor: '#FFFACD' },
            { name: 'ハムスター', radius: 24, color: '#FFDAB9', earColor: '#DEB887', bodyColor: '#FFE4C4' },
            { name: 'ウサギ', radius: 32, color: '#FFB6C1', earColor: '#FF69B4', bodyColor: '#FFC0CB' },
            { name: 'ネコ', radius: 42, color: '#E6E6FA', earColor: '#DDA0DD', bodyColor: '#F0E6FA' },
            { name: 'イヌ', radius: 54, color: '#B5EAD7', earColor: '#98D8C8', bodyColor: '#C5F0E0' },
            { name: 'レッサーパンダ', radius: 68, color: '#FFCBA4', earColor: '#8B4513', bodyColor: '#FFD8B8' },
            { name: 'ヒツジ', radius: 84, color: '#FAFAFA', earColor: '#D3D3D3', bodyColor: '#FFFFFF' },
            { name: 'クマ', radius: 102, color: '#DEB887', earColor: '#8B4513', bodyColor: '#E8C89E' },
            { name: 'ライオン', radius: 122, color: '#FFD700', earColor: '#DAA520', bodyColor: '#FFE55C' },
            { name: 'ゾウ', radius: 145, color: '#C0C0C0', earColor: '#A9A9A9', bodyColor: '#D3D3D3' }
        ];

        // 作業用動物リストとスケール
        let ANIMALS = JSON.parse(JSON.stringify(BASE_ANIMALS));
        let displayWidth = CANVAS_WIDTH;
        let displayHeight = CANVAS_HEIGHT;
        let displayScale = 1.0;

        // スコアポイント
        const SCORES = [10, 20, 40, 80, 160, 320, 640, 1280, 2560, 5120];

        // --- ゲーム状態 ---
        let engine, world, runner;
        let canvas, ctx, nextCanvas, nextCtx;
        let gameBox;
        let isGameRunning = false;
        let isGameOver = false;
        let score = 0;
        let bestScore = 0;
        let currentAnimalIndex = 0;
        let nextAnimalIndex = 0;
        let canDrop = true;
        let mouseX = CANVAS_WIDTH / 2;
        let dangerTimer = null;
        let dangerStartTime = null;
        let animals = []; // 落下した動物オブジェクトを管理
        let cooldownTimer = null;
        let animationFrameId = null;
        let gameLoopToken = 0;

        // --- スコア保存 (既存キー・形式を維持) ---
        function readBestScore() {
            try {
                const stored = Number.parseInt(window.localStorage.getItem('animalMergeBest') || '0', 10);
                return Number.isFinite(stored) && stored >= 0 ? stored : 0;
            } catch (error) {
                // ストレージが利用できない環境でもゲームは継続する
                return 0;
            }
        }

        function saveBestScoreIfHigher(nextScore) {
            if (!Number.isFinite(nextScore) || nextScore <= bestScore) return false;

            bestScore = nextScore;
            try {
                window.localStorage.setItem('animalMergeBest', String(bestScore));
            } catch (error) {
                // 保存できなくても、現在のセッション内の表示は更新する
            }
            document.getElementById('bestScore').textContent = String(bestScore);
            return true;
        }

        // --- 初期化 ---
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            nextCanvas = document.getElementById('nextCanvas');
            nextCtx = nextCanvas.getContext('2d');
            gameBox = document.getElementById('gameBox');
            bestScore = readBestScore();

            document.getElementById('bestScore').textContent = String(bestScore);

            // リサイズ実行
            handleResize();
            const handleViewportChange = () => {
                handleResize();
                if (!isGameRunning) drawPreview();
            };
            window.addEventListener('resize', handleViewportChange);
            window.addEventListener('orientationchange', handleViewportChange);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', handleViewportChange);
            }

            // イベント
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', restartGame);

            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('click', handleClick);
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });

            // パーティクル生成
            createParticles();

            // 初期描画
            drawPreview();
            drawNextAnimal();
        }

        // --- リサイズ処理 ---
        function handleResize() {
            const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
            const viewportHeight = window.visualViewport?.height || window.innerHeight;
            const isWideLayout = viewportWidth >= 900;

            // Matter.jsは350x550の論理座標で固定し、表示サイズだけを変更する。
            // これにより、プレイ中のボディ・壁・危険ラインの比率がリサイズで変わらない。
            if (isWideLayout) {
                displayHeight = Math.min(CANVAS_HEIGHT, Math.max(420, viewportHeight - 120));
                displayWidth = displayHeight * ASPECT_RATIO;
            } else {
                // 縦の短い端末では盤面を過度に縮めず、ページのスクロールで安全に操作できるようにする。
                displayWidth = Math.min(CANVAS_WIDTH, Math.max(280, viewportWidth - 24));
                displayHeight = displayWidth / ASPECT_RATIO;
            }

            displayScale = displayWidth / CANVAS_WIDTH;
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';
            gameBox.style.width = displayWidth + 'px';
            gameBox.style.height = displayHeight + 'px';

            ANIMALS = JSON.parse(JSON.stringify(BASE_ANIMALS));

            // DOMの警告線・エフェクトは表示倍率に合わせるが、判定値は論理座標のまま維持する。
            document.querySelector('.deadline').style.top = (DEADLINE_Y * displayScale) + 'px';
        }

        // --- パーティクル生成 ---
        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#ffc8dd', '#bde0fe', '#a2d2ff', '#cdb4db', '#b5ead7'];

            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 15 + 5) + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDelay = (Math.random() * 8) + 's';
                particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
                container.appendChild(particle);
            }
        }

        // --- ゲーム開始 ---
        function startGame() {
            if (isGameRunning) return;

            gameLoopToken += 1;
            isGameRunning = true;
            isGameOver = false;
            score = 0;
            animals = [];
            canDrop = true;
            dangerTimer = null;
            dangerStartTime = null;
            mouseX = CANVAS_WIDTH / 2;
            if (cooldownTimer) {
                clearTimeout(cooldownTimer);
                cooldownTimer = null;
            }

            document.getElementById('score').textContent = '0';
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('gameOverOverlay').classList.remove('active');
            // 警告初期化不要

            // Matter.js エンジン初期化
            engine = Engine.create();
            world = engine.world;
            engine.world.gravity.y = 1;

            // 壁生成
            const walls = [
                Bodies.rectangle(CANVAS_WIDTH / 2, CANVAS_HEIGHT + WALL_THICKNESS / 2, CANVAS_WIDTH, WALL_THICKNESS, { isStatic: true, label: 'floor' }),
                Bodies.rectangle(-WALL_THICKNESS / 2, CANVAS_HEIGHT / 2, WALL_THICKNESS, CANVAS_HEIGHT, { isStatic: true, label: 'leftWall' }),
                Bodies.rectangle(CANVAS_WIDTH + WALL_THICKNESS / 2, CANVAS_HEIGHT / 2, WALL_THICKNESS, CANVAS_HEIGHT, { isStatic: true, label: 'rightWall' })
            ];
            World.add(world, walls);

            // 衝突イベント
            Events.on(engine, 'collisionStart', handleCollision);

            // 次の動物を設定
            currentAnimalIndex = getRandomAnimalIndex();
            nextAnimalIndex = getRandomAnimalIndex();
            drawNextAnimal();

            // ゲームループ開始
            runner = Runner.create();
            Runner.run(runner, engine);

            requestGameFrame(gameLoopToken);
        }

        // --- ゲームリスタート ---
        function restartGame() {
            if (runner) {
                Runner.stop(runner);
            }
            if (engine) {
                World.clear(world);
                Engine.clear(engine);
            }
            startGame();
        }

        // --- ランダム動物インデックス (最初の5種類のみ出現) ---
        function getRandomAnimalIndex() {
            return Math.floor(Math.random() * 5);
        }

        // --- マウス/タッチ操作 ---
        function getLogicalX(clientX) {
            const rect = canvas.getBoundingClientRect();
            if (!rect.width) return CANVAS_WIDTH / 2;
            return (clientX - rect.left) * (CANVAS_WIDTH / rect.width);
        }

        function handleMouseMove(e) {
            mouseX = getLogicalX(e.clientX);
            clampMouseX();
        }

        function handleTouchMove(e) {
            e.preventDefault();
            mouseX = getLogicalX(e.touches[0].clientX);
            clampMouseX();
        }

        function clampMouseX() {
            const r = ANIMALS[currentAnimalIndex].radius;
            mouseX = Math.max(r + 5, Math.min(CANVAS_WIDTH - r - 5, mouseX));
        }

        function handleClick(e) {
            if (!isGameRunning || !canDrop || isGameOver) return;
            dropAnimal();
        }

        function handleTouchStart(e) {
            e.preventDefault();
            if (!isGameRunning || !canDrop || isGameOver) return;
            mouseX = getLogicalX(e.touches[0].clientX);
            clampMouseX();
            dropAnimal();
        }

        // --- 動物ドロップ ---
        function dropAnimal() {
            canDrop = false;
            const animal = ANIMALS[currentAnimalIndex];

            const body = Bodies.circle(mouseX, 40, animal.radius, {
                restitution: 0.2,
                friction: 0.5,
                frictionAir: 0.01,
                label: 'animal',
                animalIndex: currentAnimalIndex
            });

            World.add(world, body);
            animals.push(body);

            // 次の動物
            currentAnimalIndex = nextAnimalIndex;
            nextAnimalIndex = getRandomAnimalIndex();
            drawNextAnimal();

            // ドロップクールダウン
            cooldownTimer = setTimeout(() => {
                canDrop = true;
                cooldownTimer = null;
            }, 500);
        }

        // --- 衝突処理 ---
        function handleCollision(event) {
            const pairs = event.pairs;

            for (const pair of pairs) {
                const bodyA = pair.bodyA;
                const bodyB = pair.bodyB;

                if (bodyA.label === 'animal' && bodyB.label === 'animal') {
                    if (bodyA.animalIndex === bodyB.animalIndex && bodyA.animalIndex < ANIMALS.length - 1) {
                        // マージ処理
                        const newIndex = bodyA.animalIndex + 1;
                        const newX = (bodyA.position.x + bodyB.position.x) / 2;
                        const newY = (bodyA.position.y + bodyB.position.y) / 2;

                        // 古い動物を削除
                        World.remove(world, bodyA);
                        World.remove(world, bodyB);
                        animals = animals.filter(a => a !== bodyA && a !== bodyB);

                        // 新しい動物を生成
                        const newAnimal = ANIMALS[newIndex];
                        const newBody = Bodies.circle(newX, newY, newAnimal.radius, {
                            restitution: 0.2,
                            friction: 0.5,
                            frictionAir: 0.01,
                            label: 'animal',
                            animalIndex: newIndex
                        });
                        World.add(world, newBody);
                        animals.push(newBody);

                        // スコア加算
                        score += SCORES[newIndex];
                        document.getElementById('score').textContent = score;

                        // マージエフェクト
                        showMergeEffect(newX, newY, newAnimal.radius);

                        // 反重力エフェクト - 周囲の動物を少し浮かせる
                        applyAntiGravityEffect(newX, newY);

                        break; // 1フレームに1マージのみ
                    }
                }
            }
        }

        // --- マージエフェクト ---
        function showMergeEffect(x, y, radius) {
            const effect = document.createElement('div');
            effect.className = 'merge-effect';
            effect.style.left = ((x - radius) * displayScale) + 'px';
            effect.style.top = ((y - radius) * displayScale) + 'px';
            effect.style.width = (radius * 2 * displayScale) + 'px';
            effect.style.height = (radius * 2 * displayScale) + 'px';
            gameBox.appendChild(effect);

            setTimeout(() => effect.remove(), 400);
        }

        // --- 反重力エフェクト ---
        function applyAntiGravityEffect(centerX, centerY) {
            for (const body of animals) {
                const dx = body.position.x - centerX;
                const dy = body.position.y - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 200 && dist > 0) {
                    const force = 0.015 * (1 - dist / 200);
                    Body.applyForce(body, body.position, {
                        x: 0,
                        y: -force
                    });
                }
            }
        }

        // --- ゲームオーバー判定 ---
        function checkGameOver() {
            let anyAboveDeadline = false;

            for (const body of animals) {
                if (body.position.y - ANIMALS[body.animalIndex].radius < DEADLINE_Y) {
                    anyAboveDeadline = true;
                    break;
                }
            }

            if (anyAboveDeadline) {
                if (!dangerStartTime) {
                    dangerStartTime = Date.now();
                    // 警告表示なし
                } else if (Date.now() - dangerStartTime > DANGER_TIME) {
                    endGame();
                }
            } else {
                dangerStartTime = null;
                // 警告非表示なし
            }
        }

        // --- ゲーム終了 ---
        function endGame() {
            isGameOver = true;
            isGameRunning = false;
            gameLoopToken += 1;

            if (runner) Runner.stop(runner);
            if (animationFrameId !== null) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverOverlay').classList.add('active');
            document.getElementById('startBtn').style.display = 'none';

            // ベストスコア更新 (既存値より低いスコアでは保存しない)
            saveBestScoreIfHigher(score);
        }

        // --- 描画: Next動物 ---
        function drawNextAnimal() {
            const canvasSize = nextCanvas.width;
            nextCtx.clearRect(0, 0, canvasSize, canvasSize);
            const animal = ANIMALS[nextAnimalIndex];
            const center = canvasSize / 2;
            const scale = (canvasSize - 8) / (animal.radius * 2);
            const r = animal.radius * scale;
            drawAnimalShape(nextCtx, center, center, r, animal, nextAnimalIndex);
        }

        // --- 描画: プレビュー ---
        function drawPreview() {
            if (!isGameRunning || !canDrop) return;

            const animal = ANIMALS[currentAnimalIndex];

            // ドロップライン
            ctx.save();
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(160, 140, 200, 0.4)';
            ctx.beginPath();
            ctx.moveTo(mouseX, 50);
            ctx.lineTo(mouseX, CANVAS_HEIGHT);
            ctx.stroke();
            ctx.restore();

            // プレビュー動物
            ctx.globalAlpha = 0.6;
            drawAnimalShape(ctx, mouseX, 40, animal.radius, animal, currentAnimalIndex);
            ctx.globalAlpha = 1;
        }

        // --- 動物描画関数 ---
        function drawAnimalShape(context, x, y, radius, animal, index, angle = 0) {
            const r = radius;

            // 影
            context.save();
            context.fillStyle = 'rgba(0,0,0,0.15)';
            context.beginPath();
            context.arc(x + 3, y + 3, r, 0, Math.PI * 2);
            context.fill();
            context.restore();

            // 回転適用 (体・顔・ハイライト)
            context.save();
            context.translate(x, y);
            context.rotate(angle);
            context.translate(-x, -y);

            // 体 (メインの円)
            context.save();
            const gradient = context.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
            gradient.addColorStop(0, animal.bodyColor);
            gradient.addColorStop(1, animal.color);
            context.fillStyle = gradient;
            context.beginPath();
            context.arc(x, y, r, 0, Math.PI * 2);
            context.fill();
            context.restore();

            // 動物ごとの特徴描画
            switch (index) {
                case 0: drawChick(context, x, y, r); break;
                case 1: drawHamster(context, x, y, r); break;
                case 2: drawRabbit(context, x, y, r); break;
                case 3: drawCat(context, x, y, r); break;
                case 4: drawDog(context, x, y, r); break;
                case 5: drawRedPanda(context, x, y, r); break;
                case 6: drawSheep(context, x, y, r); break;
                case 7: drawBear(context, x, y, r); break;
                case 8: drawLion(context, x, y, r); break;
                case 9: drawElephant(context, x, y, r); break;
            }

            // ハイライト (光沢)
            context.save();
            context.fillStyle = 'rgba(255,255,255,0.5)';
            context.beginPath();
            context.ellipse(x - r * 0.35, y - r * 0.35, r * 0.25, r * 0.15, -Math.PI / 4, 0, Math.PI * 2);
            context.fill();
            context.restore();

            // 回転終了
            context.restore();
        }

        // --- 各動物の特徴描画 ---
        function drawChick(ctx, x, y, r) {
            // クチバシ
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + r * 0.4, y + r * 0.2);
            ctx.lineTo(x, y + r * 0.4);
            ctx.fill();
            // 目
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x - r * 0.25, y - r * 0.1, r * 0.12, 0, Math.PI * 2);
            ctx.fill();
            // 頭の羽
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(x, y - r * 0.9, r * 0.15, r * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawHamster(ctx, x, y, r) {
            // 耳
            ctx.fillStyle = '#DEB887';
            ctx.beginPath();
            ctx.arc(x - r * 0.7, y - r * 0.5, r * 0.3, 0, Math.PI * 2);
            ctx.arc(x + r * 0.7, y - r * 0.5, r * 0.3, 0, Math.PI * 2);
            ctx.fill();
            // ほっぺ
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.arc(x - r * 0.5, y + r * 0.2, r * 0.25, 0, Math.PI * 2);
            ctx.arc(x + r * 0.5, y + r * 0.2, r * 0.25, 0, Math.PI * 2);
            ctx.fill();
            // 目
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x - r * 0.3, y - r * 0.15, r * 0.1, 0, Math.PI * 2);
            ctx.arc(x + r * 0.3, y - r * 0.15, r * 0.1, 0, Math.PI * 2);
            ctx.fill();
            // 鼻
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath();
            ctx.arc(x, y + r * 0.1, r * 0.08, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawRabbit(ctx, x, y, r) {
            // 長い耳
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.ellipse(x - r * 0.4, y - r * 1.1, r * 0.2, r * 0.5, -0.2, 0, Math.PI * 2);
            ctx.ellipse(x + r * 0.4, y - r * 1.1, r * 0.2, r * 0.5, 0.2, 0, Math.PI * 2);
            ctx.fill();
            // 耳の内側
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath();
            ctx.ellipse(x - r * 0.4, y - r * 1.1, r * 0.1, r * 0.35, -0.2, 0, Math.PI * 2);
            ctx.ellipse(x + r * 0.4, y - r * 1.1, r * 0.1, r * 0.35, 0.2, 0, Math.PI * 2);
            ctx.fill();
            // 目
            ctx.fillStyle = '#FF1493';
            ctx.beginPath();
            ctx.arc(x - r * 0.3, y - r * 0.1, r * 0.12, 0, Math.PI * 2);
            ctx.arc(x + r * 0.3, y - r * 0.1, r * 0.12, 0, Math.PI * 2);
            ctx.fill();
            // 鼻
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.arc(x, y + r * 0.15, r * 0.1, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCat(ctx, x, y, r) {
            // 三角耳
            ctx.fillStyle = '#DDA0DD';
            ctx.beginPath();
            ctx.moveTo(x - r * 0.7, y - r * 0.4);
            ctx.lineTo(x - r * 0.4, y - r * 1);
            ctx.lineTo(x - r * 0.1, y - r * 0.4);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + r * 0.7, y - r * 0.4);
            ctx.lineTo(x + r * 0.4, y - r * 1);
            ctx.lineTo(x + r * 0.1, y - r * 0.4);
            ctx.fill();
            // 目
            ctx.fillStyle = '#32CD32';
            ctx.beginPath();
            ctx.ellipse(x - r * 0.3, y - r * 0.1, r * 0.15, r * 0.18, 0, 0, Math.PI * 2);
            ctx.ellipse(x + r * 0.3, y - r * 0.1, r * 0.15, r * 0.18, 0, 0, Math.PI * 2);
            ctx.fill();
            // 瞳
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(x - r * 0.3, y - r * 0.1, r * 0.05, r * 0.12, 0, 0, Math.PI * 2);
            ctx.ellipse(x + r * 0.3, y - r * 0.1, r * 0.05, r * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();
            // 鼻
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath();
            ctx.moveTo(x, y + r * 0.05);
            ctx.lineTo(x - r * 0.08, y + r * 0.18);
            ctx.lineTo(x + r * 0.08, y + r * 0.18);
            ctx.fill();
            // ひげ
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x - r * 0.2, y + r * 0.15);
            ctx.lineTo(x - r * 0.6, y + r * 0.1);
            ctx.moveTo(x - r * 0.2, y + r * 0.25);
            ctx.lineTo(x - r * 0.6, y + r * 0.25);
            ctx.moveTo(x + r * 0.2, y + r * 0.15);
            ctx.lineTo(x + r * 0.6, y + r * 0.1);
            ctx.moveTo(x + r * 0.2, y + r * 0.25);
            ctx.lineTo(x + r * 0.6, y + r * 0.25);
            ctx.stroke();
        }

        function drawDog(ctx, x, y, r) {
            // 垂れ耳
            ctx.fillStyle = '#7CB9A8';
            ctx.beginPath();
            ctx.ellipse(x - r * 0.75, y - r * 0.2, r * 0.25, r * 0.45, -0.3, 0, Math.PI * 2);
            ctx.ellipse(x + r * 0.75, y - r * 0.2, r * 0.25, r * 0.45, 0.3, 0, Math.PI * 2);
            ctx.fill();
            // 目
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x - r * 0.3, y - r * 0.15, r * 0.12, 0, Math.PI * 2);
            ctx.arc(x + r * 0.3, y - r * 0.15, r * 0.12, 0, Math.PI * 2);
            ctx.fill();
            // 目のハイライト
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x - r * 0.26, y - r * 0.18, r * 0.04, 0, Math.PI * 2);
            ctx.arc(x + r * 0.34, y - r * 0.18, r * 0.04, 0, Math.PI * 2);
            ctx.fill();
            // 鼻
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(x, y + r * 0.15, r * 0.15, r * 0.1, 0, 0, Math.PI * 2);
            ctx.fill();
            // 舌
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath();
            ctx.ellipse(x, y + r * 0.4, r * 0.1, r * 0.15, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawRedPanda(ctx, x, y, r) {
            // 耳
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.arc(x - r * 0.7, y - r * 0.6, r * 0.25, 0, Math.PI * 2);
            ctx.arc(x + r * 0.7, y - r * 0.6, r * 0.25, 0, Math.PI * 2);
            ctx.fill();
            // 白いマスク模様
            ctx.fillStyle = '#FFFAF0';
            ctx.beginPath();
            ctx.ellipse(x, y + r * 0.1, r * 0.5, r * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();
            // 目
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x - r * 0.3, y - r * 0.1, r * 0.1, 0, Math.PI * 2);
            ctx.arc(x + r * 0.3, y - r * 0.1, r * 0.1, 0, Math.PI * 2);
            ctx.fill();
            // 鼻
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x, y + r * 0.15, r * 0.08, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawSheep(ctx, x, y, r) {
            // もこもこ
            ctx.fillStyle = '#FAFAFA';
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const cx = x + Math.cos(angle) * r * 0.7;
                const cy = y + Math.sin(angle) * r * 0.7;
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.35, 0, Math.PI * 2);
                ctx.fill();
            }
            // 顔
            ctx.fillStyle = '#FFE4E1';
            ctx.beginPath();
            ctx.arc(x, y, r * 0.55, 0, Math.PI * 2);
            ctx.fill();
            // 耳
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.ellipse(x - r * 0.5, y - r * 0.15, r * 0.15, r * 0.25, -0.5, 0, Math.PI * 2);
            ctx.ellipse(x + r * 0.5, y - r * 0.15, r * 0.15, r * 0.25, 0.5, 0, Math.PI * 2);
            ctx.fill();
            // 目
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x - r * 0.2, y - r * 0.1, r * 0.07, 0, Math.PI * 2);
            ctx.arc(x + r * 0.2, y - r * 0.1, r * 0.07, 0, Math.PI * 2);
            ctx.fill();
            // 鼻
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath();
            ctx.arc(x, y + r * 0.1, r * 0.06, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBear(ctx, x, y, r) {
            // 丸耳
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.arc(x - r * 0.7, y - r * 0.6, r * 0.3, 0, Math.PI * 2);
            ctx.arc(x + r * 0.7, y - r * 0.6, r * 0.3, 0, Math.PI * 2);
            ctx.fill();
            // 耳の内側
            ctx.fillStyle = '#BC8F8F';
            ctx.beginPath();
            ctx.arc(x - r * 0.7, y - r * 0.6, r * 0.18, 0, Math.PI * 2);
            ctx.arc(x + r * 0.7, y - r * 0.6, r * 0.18, 0, Math.PI * 2);
            ctx.fill();
            // マズル
            ctx.fillStyle = '#F5DEB3';
            ctx.beginPath();
            ctx.ellipse(x, y + r * 0.2, r * 0.35, r * 0.25, 0, 0, Math.PI * 2);
            ctx.fill();
            // 目
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x - r * 0.3, y - r * 0.15, r * 0.1, 0, Math.PI * 2);
            ctx.arc(x + r * 0.3, y - r * 0.15, r * 0.1, 0, Math.PI * 2);
            ctx.fill();
            // 鼻
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(x, y + r * 0.15, r * 0.12, r * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawLion(ctx, x, y, r) {
            // たてがみ
            ctx.fillStyle = '#DAA520';
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const cx = x + Math.cos(angle) * r * 0.8;
                const cy = y + Math.sin(angle) * r * 0.8;
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.35, 0, Math.PI * 2);
                ctx.fill();
            }
            // 顔
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(x, y, r * 0.65, 0, Math.PI * 2);
            ctx.fill();
            // 目
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.arc(x - r * 0.25, y - r * 0.1, r * 0.1, 0, Math.PI * 2);
            ctx.arc(x + r * 0.25, y - r * 0.1, r * 0.1, 0, Math.PI * 2);
            ctx.fill();
            // 鼻
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.moveTo(x, y + r * 0.05);
            ctx.lineTo(x - r * 0.1, y + r * 0.2);
            ctx.lineTo(x + r * 0.1, y + r * 0.2);
            ctx.fill();
            // 口
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y + r * 0.2);
            ctx.lineTo(x, y + r * 0.35);
            ctx.moveTo(x - r * 0.15, y + r * 0.35);
            ctx.quadraticCurveTo(x, y + r * 0.45, x + r * 0.15, y + r * 0.35);
            ctx.stroke();
        }

        function drawElephant(ctx, x, y, r) {
            // 大きな耳
            ctx.fillStyle = '#A9A9A9';
            ctx.beginPath();
            ctx.ellipse(x - r * 0.85, y - r * 0.1, r * 0.45, r * 0.6, -0.3, 0, Math.PI * 2);
            ctx.ellipse(x + r * 0.85, y - r * 0.1, r * 0.45, r * 0.6, 0.3, 0, Math.PI * 2);
            ctx.fill();
            // 耳の内側
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.ellipse(x - r * 0.85, y - r * 0.1, r * 0.3, r * 0.45, -0.3, 0, Math.PI * 2);
            ctx.ellipse(x + r * 0.85, y - r * 0.1, r * 0.3, r * 0.45, 0.3, 0, Math.PI * 2);
            ctx.fill();
            // 鼻
            ctx.fillStyle = '#B8B8B8';
            ctx.beginPath();
            ctx.moveTo(x - r * 0.15, y + r * 0.1);
            ctx.quadraticCurveTo(x - r * 0.2, y + r * 0.5, x, y + r * 0.8);
            ctx.quadraticCurveTo(x + r * 0.2, y + r * 0.5, x + r * 0.15, y + r * 0.1);
            ctx.fill();
            // 目
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x - r * 0.3, y - r * 0.2, r * 0.08, 0, Math.PI * 2);
            ctx.arc(x + r * 0.3, y - r * 0.2, r * 0.08, 0, Math.PI * 2);
            ctx.fill();
        }

        // --- ゲームループ ---
        function requestGameFrame(token) {
            animationFrameId = requestAnimationFrame(() => gameLoop(token));
        }

        function gameLoop(token) {
            animationFrameId = null;
            if (!isGameRunning || token !== gameLoopToken) return;

            // キャンバスクリア
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 動物描画
            const bodies = Matter.Composite.allBodies(world);
            for (const body of bodies) {
                if (body.label === 'animal') {
                    const animal = ANIMALS[body.animalIndex];
                    drawAnimalShape(ctx, body.position.x, body.position.y, animal.radius, animal, body.animalIndex, body.angle);
                }
            }

            // プレビュー描画
            drawPreview();

            // ゲームオーバー判定
            checkGameOver();

            if (isGameRunning && token === gameLoopToken) {
                requestGameFrame(token);
            }
        }

        // --- 初期化実行 ---
        init();
    </script>

</body>

</html>
